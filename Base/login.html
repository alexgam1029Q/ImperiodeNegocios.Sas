<link rel="stylesheet" href="css/styles.css?v=25">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    window.SUPABASE_URL = 'https://chcuojprqzpiyknnkhwn.supabase.co';
    window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoY3VvanBycXpwaXlrbm5raHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MTcxNjIsImV4cCI6MjEwMTE5MzE2Mn0.0vqJEIe-ZtMuYSsr_7vbMk8NyawVGqBx7scVpgEuYW0';
</script>
<script defer src="js/services/db.js?v=64"></script>
</head>
<body>
<div class="login-screen" id="loginPage">
    <button id="loginInstallAppBtn" class="login-install-app-btn" type="button" aria-label="Instalar aplicación">
        <img src="assets/logos/app-icon-192.png" alt="" width="22" height="22" aria-hidden="true">
        <span>Instalar app</span>
    </button>
    <img src="assets/logos/logo.png" class="logo-img" alt="Logo">
    <div class="login-box">
        <h1 style="color: var(--primary); font-size: 22px; letter-spacing: 2px; margin: 0 0 25px; text-align: center; text-shadow: 0 0 10px var(--primary);">INICIAR SESIÓN</h1>
        <form id="loginForm">
            <input type="text" id="loginUsername" placeholder="Usuario" autocomplete="username" maxlength="20" required>
            <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="submit">Iniciar sesión</button>
        </form>
        <div id="loginMessage" style="min-height:20px; color:#ff8888; text-align:center; font-size:0.85em;"></div>
        <div class="login-divider" aria-hidden="true"><span>o</span></div>
        <button id="googleLoginButton" class="google-login-button" type="button">
            <svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="#4285F4" d="M21.35 12.27c0-.71-.06-1.4-.18-2.05H12v3.88h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.19z"/>
                <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.51A9.74 9.74 0 0 0 12 21.75z"/>
                <path fill="#FBBC05" d="M6.54 13.86a5.86 5.86 0 0 1 0-3.72V7.63H3.3a9.76 9.76 0 0 0 0 8.74l3.24-2.51z"/>
                <path fill="#EA4335" d="M12 6.11c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.2 14.63 2.25 12 2.25a9.74 9.74 0 0 0-8.7 5.38l3.24 2.51C7.31 7.83 9.46 6.11 12 6.11z"/>
            </svg>
            <span>Continuar con Google</span>
        </button>
        <a href="registro.html" style="display:block; margin-top:18px; color:var(--primary); text-align:center;">Crear una cuenta</a>
    </div>
</div>
<script>
    const message = document.getElementById('loginMessage');
    const installButton = document.getElementById('loginInstallAppBtn');
    const appInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    installButton.hidden = appInstalada;
    let instalacionPendiente = null;
    window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        instalacionPendiente = event;
    });
    installButton.addEventListener('click', async () => {
        if (!instalacionPendiente) {
            alert('La instalación no está disponible todavía. Abre el menú del navegador y elige "Instalar aplicación".');
            return;
        }
        instalacionPendiente.prompt();
        await instalacionPendiente.userChoice;
        instalacionPendiente = null;
    });
    window.addEventListener('appinstalled', () => {
        instalacionPendiente = null;
        installButton.hidden = true;
    });
    if (location.hostname !== '127.0.0.1' && location.hostname !== 'localhost' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=77').catch(() => {});
    }
    document.getElementById('googleLoginButton').addEventListener('click', async () => {
        try { await db.signInWithGoogle(); } catch (error) { message.textContent = error.message || 'No se pudo iniciar sesión con Google.'; }
    });
    document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button');
        button.disabled = true;
        message.textContent = 'Comprobando datos...';
        try {
            await db.signIn(document.getElementById('loginUsername').value, document.getElementById('loginPassword').value);
            window.location.href = 'index.html';
        } catch (error) {
            message.textContent = error.message || 'Datos incorrectos.';
            button.disabled = false;
        }
    });
</script>
</body>
</html>
